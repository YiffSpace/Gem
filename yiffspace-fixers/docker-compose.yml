services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yiffspace_fixers_gem_test
    ports:
      - "${POSTGRES_HOST:-127.127.127.127}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yiffspace_fixers_gem_test"]
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  postgres_data:
